version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: chatlingua-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: chatlingua_root
      MYSQL_DATABASE: chatlingua
      MYSQL_USER: chatlingua
      MYSQL_PASSWORD: chatlingua_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
