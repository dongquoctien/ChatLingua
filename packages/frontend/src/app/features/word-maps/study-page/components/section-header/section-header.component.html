<div class="section-header rounded-lg overflow-hidden shadow-sm">
  <div [class]="'px-4 py-2 ' + colorClasses">
    <span class="text-sm font-bold uppercase tracking-wide">{{ header.title }}</span>
  </div>
  <div class="bg-white px-4 py-2 border-l-4" [class]="'border-' + header.color + '-500'">
    <span class="text-gray-800 font-medium">{{ header.subtitle }}</span>
  </div>
</div>
