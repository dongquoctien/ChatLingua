<div class="comment-item" [ngClass]="indentClass" [class.border-l-2]="depth > 0" [class.border-gray-200]="depth > 0" [class.pl-4]="depth > 0">
  <div class="comment-content bg-white rounded-lg p-4" [class.bg-gray-50]="comment.isDeleted">
    <!-- Comment Header -->
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-2">
        <!-- Avatar -->
        <img
          [src]="comment.author.avatar || '/assets/default-avatar.png'"
          [alt]="comment.author.displayName"
          class="w-8 h-8 rounded-full object-cover"
        />

        <div>
          <div class="flex items-center gap-2">
            <a
              [routerLink]="['/forum/authors', comment.author.username]"
              class="font-medium text-gray-900 hover:text-gray-700"
            >
              {{ comment.author.displayName }}
            </a>
            <app-author-badge [rank]="comment.author.rank" size="small" [showLabel]="false"></app-author-badge>
            <span *ngIf="isAuthor" class="text-xs px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded">You</span>
          </div>
          <div class="flex items-center gap-2 text-xs text-gray-500">
            <span>{{ getTimeAgo(comment.createdAt) }}</span>
            <span *ngIf="comment.isEdited" class="italic">(edited)</span>
          </div>
        </div>
      </div>

      <!-- Menu -->
      <div class="relative" *ngIf="isAuthenticated">
        <button
          type="button"
          (click)="toggleMenu()"
          class="p-1 text-gray-400 hover:text-gray-600 rounded"
        >
          <fa-icon [icon]="faEllipsisV"></fa-icon>
        </button>

        <div
          *ngIf="showMenu"
          class="absolute right-0 mt-1 w-32 bg-white border border-gray-200 rounded-lg shadow-lg z-10"
        >
          <button
            *ngIf="isAuthor"
            type="button"
            (click)="toggleEditForm(); showMenu = false"
            class="w-full px-3 py-2 text-left text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2"
          >
            <fa-icon [icon]="faEdit" class="text-gray-400"></fa-icon>
            Edit
          </button>
          <button
            *ngIf="isAuthor"
            type="button"
            (click)="onDelete()"
            class="w-full px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50 flex items-center gap-2"
          >
            <fa-icon [icon]="faTrash" class="text-red-400"></fa-icon>
            Delete
          </button>
          <button
            *ngIf="!isAuthor"
            type="button"
            (click)="onReport()"
            class="w-full px-3 py-2 text-left text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2"
          >
            <fa-icon [icon]="faFlag" class="text-gray-400"></fa-icon>
            Report
          </button>
        </div>
      </div>
    </div>

    <!-- Comment Body -->
    <div class="mt-3">
      <!-- Normal view -->
      <p *ngIf="!showEditForm && !comment.isDeleted" class="text-gray-700 whitespace-pre-wrap">
        {{ comment.content }}
      </p>

      <!-- Deleted message -->
      <p *ngIf="comment.isDeleted" class="text-gray-400 italic">
        [This comment has been deleted]
      </p>

      <!-- Edit form -->
      <div *ngIf="showEditForm" class="edit-form">
        <textarea
          [(ngModel)]="editContent"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent resize-none"
          placeholder="Edit your comment..."
        ></textarea>
        <div class="flex justify-end gap-2 mt-2">
          <button
            type="button"
            (click)="cancelEdit()"
            class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg"
          >
            Cancel
          </button>
          <button
            type="button"
            (click)="submitEdit()"
            [disabled]="!editContent.trim()"
            class="px-3 py-1.5 text-sm bg-gray-900 text-white rounded-lg hover:bg-gray-800 disabled:opacity-50"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Comment Actions -->
    <div *ngIf="!comment.isDeleted" class="flex items-center gap-4 mt-3 pt-3 border-t border-gray-100">
      <!-- Upvote -->
      <button
        type="button"
        (click)="onUpvote()"
        class="flex items-center gap-1 text-sm transition-colors"
        [ngClass]="comment.userVote === 'upvote' ? 'text-green-600' : 'text-gray-500 hover:text-green-600'"
        [disabled]="!isAuthenticated"
      >
        <fa-icon [icon]="faThumbsUp"></fa-icon>
        <span>{{ comment.upvoteCount }}</span>
      </button>

      <!-- Reply -->
      <button
        *ngIf="canReply"
        type="button"
        (click)="toggleReplyForm()"
        class="flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700"
      >
        <fa-icon [icon]="faReply"></fa-icon>
        <span>Reply</span>
      </button>
    </div>

    <!-- Reply Form -->
    <div *ngIf="showReplyForm" class="reply-form mt-3 pt-3 border-t border-gray-100">
      <textarea
        [(ngModel)]="replyContent"
        rows="2"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent resize-none"
        placeholder="Write a reply..."
      ></textarea>
      <div class="flex justify-end gap-2 mt-2">
        <button
          type="button"
          (click)="cancelReply()"
          class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="submitReply()"
          [disabled]="!replyContent.trim()"
          class="px-3 py-1.5 text-sm bg-gray-900 text-white rounded-lg hover:bg-gray-800 disabled:opacity-50"
        >
          Reply
        </button>
      </div>
    </div>
  </div>

  <!-- Nested Replies -->
  <div *ngIf="comment.replies && comment.replies.length > 0" class="replies mt-2 space-y-2">
    <app-comment-item
      *ngFor="let reply of comment.replies"
      [comment]="reply"
      [depth]="depth + 1"
      [maxDepth]="maxDepth"
      (reply)="reply.emit($event)"
      (edit)="edit.emit($event)"
      (delete)="delete.emit($event)"
      (report)="report.emit($event)"
      (vote)="vote.emit($event)"
    ></app-comment-item>
  </div>
</div>
