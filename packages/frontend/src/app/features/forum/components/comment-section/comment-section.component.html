<div class="comment-section">
  <!-- Header -->
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">
      <fa-icon [icon]="faComments" class="text-gray-600"></fa-icon>
      <h3 class="font-semibold text-gray-900">Comments</h3>
      <span class="text-sm text-gray-500">({{ totalCount }})</span>
    </div>

    <!-- Sort dropdown -->
    <div class="relative" *ngIf="comments.length > 0">
      <button
        type="button"
        (click)="toggleSortMenu()"
        class="flex items-center gap-2 px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
      >
        <fa-icon [icon]="faSort"></fa-icon>
        <span>{{ sortLabel }}</span>
      </button>

      <div
        *ngIf="showSortMenu"
        class="absolute right-0 mt-1 w-36 bg-white border border-gray-200 rounded-lg shadow-lg z-10"
      >
        <button
          type="button"
          (click)="selectSort('newest')"
          class="w-full px-3 py-2 text-left text-sm hover:bg-gray-50"
          [class.text-gray-900]="sortBy() === 'newest'"
          [class.font-medium]="sortBy() === 'newest'"
          [class.text-gray-600]="sortBy() !== 'newest'"
        >
          Newest
        </button>
        <button
          type="button"
          (click)="selectSort('oldest')"
          class="w-full px-3 py-2 text-left text-sm hover:bg-gray-50"
          [class.text-gray-900]="sortBy() === 'oldest'"
          [class.font-medium]="sortBy() === 'oldest'"
          [class.text-gray-600]="sortBy() !== 'oldest'"
        >
          Oldest
        </button>
        <button
          type="button"
          (click)="selectSort('popular')"
          class="w-full px-3 py-2 text-left text-sm hover:bg-gray-50"
          [class.text-gray-900]="sortBy() === 'popular'"
          [class.font-medium]="sortBy() === 'popular'"
          [class.text-gray-600]="sortBy() !== 'popular'"
        >
          Most Popular
        </button>
      </div>
    </div>
  </div>

  <!-- Add Comment Form -->
  <div *ngIf="isAuthenticated" class="add-comment-form mb-6">
    <div class="flex gap-3">
      <textarea
        [(ngModel)]="newComment"
        rows="3"
        class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent resize-none"
        placeholder="Write a comment..."
        [disabled]="submitting"
      ></textarea>
    </div>
    <div class="flex justify-end mt-2">
      <button
        type="button"
        (click)="submitComment()"
        [disabled]="!newComment.trim() || submitting"
        class="flex items-center gap-2 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        <fa-icon [icon]="submitting ? faSpinner : faPaperPlane" [animation]="submitting ? 'spin' : undefined"></fa-icon>
        <span>{{ submitting ? 'Posting...' : 'Post Comment' }}</span>
      </button>
    </div>
  </div>

  <!-- Login prompt -->
  <div *ngIf="!isAuthenticated" class="login-prompt mb-6 p-4 bg-gray-50 rounded-lg text-center">
    <p class="text-gray-600">
      <a routerLink="/auth/login" class="text-gray-900 font-medium hover:underline">Log in</a>
      to join the conversation
    </p>
  </div>

  <!-- Loading state -->
  <div *ngIf="loading && comments.length === 0" class="loading-state py-8 text-center">
    <fa-icon [icon]="faSpinner" animation="spin" class="text-2xl text-gray-400"></fa-icon>
    <p class="text-gray-500 mt-2">Loading comments...</p>
  </div>

  <!-- Comments list -->
  <div *ngIf="comments.length > 0" class="comments-list space-y-4">
    <app-comment-item
      *ngFor="let comment of comments"
      [comment]="comment"
      [depth]="0"
      [maxDepth]="maxDepth"
      (reply)="onReply($event)"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (report)="onReport($event)"
      (vote)="onVote($event)"
    ></app-comment-item>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && comments.length === 0" class="empty-state py-8 text-center">
    <fa-icon [icon]="faComments" class="text-4xl text-gray-300"></fa-icon>
    <p class="text-gray-500 mt-2">No comments yet</p>
    <p *ngIf="isAuthenticated" class="text-sm text-gray-400">Be the first to comment!</p>
  </div>

  <!-- Load more button -->
  <div *ngIf="hasMoreComments" class="load-more mt-4 text-center">
    <button
      type="button"
      (click)="onLoadMore()"
      [disabled]="loading"
      class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50"
    >
      <fa-icon *ngIf="loading" [icon]="faSpinner" animation="spin" class="mr-2"></fa-icon>
      <span>{{ loading ? 'Loading...' : 'Load more comments' }}</span>
    </button>
  </div>
</div>
