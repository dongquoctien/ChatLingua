<div class="content-preview space-y-4">
  <!-- Vocabulary Section -->
  <div *ngIf="vocabulary.length > 0" class="vocabulary-section">
    <button
      type="button"
      (click)="toggleVocabulary()"
      class="section-header w-full flex items-center justify-between p-3 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors"
      [class.cursor-pointer]="collapsible"
      [class.cursor-default]="!collapsible"
    >
      <div class="flex items-center gap-2">
        <fa-icon [icon]="faBook" class="text-blue-600"></fa-icon>
        <span class="font-medium text-gray-900">Vocabulary</span>
        <span class="text-sm text-gray-500">({{ vocabulary.length }} words)</span>
      </div>
      <fa-icon
        *ngIf="collapsible && hasMoreVocabulary"
        [icon]="vocabularyExpanded ? faChevronUp : faChevronDown"
        class="text-gray-400"
      ></fa-icon>
    </button>

    <div class="vocabulary-list mt-2 space-y-2">
      <div
        *ngFor="let vocab of previewVocabulary"
        class="vocab-item flex items-center justify-between p-2 bg-white border border-gray-100 rounded-lg"
      >
        <div class="flex items-center gap-3">
          <span class="vietnamese font-medium text-gray-900">{{ vocab.vietnameseWord }}</span>
          <span class="text-gray-400">→</span>
          <span class="english text-gray-700">{{ vocab.englishWord }}</span>
          <span *ngIf="vocab.phonetic" class="phonetic text-sm text-gray-400">{{ vocab.phonetic }}</span>
        </div>
        <span
          class="pos text-xs px-2 py-0.5 rounded-full"
          [ngClass]="getPartOfSpeechClass(vocab.partOfSpeech)"
        >
          {{ vocab.partOfSpeech }}
        </span>
      </div>

      <button
        *ngIf="hasMoreVocabulary && !vocabularyExpanded"
        type="button"
        (click)="toggleVocabulary()"
        class="w-full py-2 text-sm text-blue-600 hover:text-blue-800 hover:bg-blue-50 rounded-lg transition-colors"
      >
        Show {{ vocabulary.length - 5 }} more words
      </button>
    </div>
  </div>

  <!-- Grammar Section -->
  <div *ngIf="grammarPoints.length > 0" class="grammar-section">
    <button
      type="button"
      (click)="toggleGrammar()"
      class="section-header w-full flex items-center justify-between p-3 bg-purple-50 rounded-lg hover:bg-purple-100 transition-colors"
      [class.cursor-pointer]="collapsible"
      [class.cursor-default]="!collapsible"
    >
      <div class="flex items-center gap-2">
        <fa-icon [icon]="faGraduationCap" class="text-purple-600"></fa-icon>
        <span class="font-medium text-gray-900">Grammar Points</span>
        <span class="text-sm text-gray-500">({{ grammarPoints.length }} points)</span>
      </div>
      <fa-icon
        *ngIf="collapsible && hasMoreGrammar"
        [icon]="grammarExpanded ? faChevronUp : faChevronDown"
        class="text-gray-400"
      ></fa-icon>
    </button>

    <div class="grammar-list mt-2 space-y-2">
      <div
        *ngFor="let grammar of previewGrammar"
        class="grammar-item p-3 bg-white border border-gray-100 rounded-lg"
      >
        <div class="flex items-start justify-between gap-2">
          <div>
            <h4 class="font-medium text-gray-900">{{ grammar.grammarRule }}</h4>
            <p class="text-sm text-gray-600 mt-1 line-clamp-2">{{ grammar.explanation }}</p>
          </div>
          <span
            *ngIf="grammar.category"
            class="text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded-full whitespace-nowrap"
          >
            {{ grammar.category }}
          </span>
        </div>
      </div>

      <button
        *ngIf="hasMoreGrammar && !grammarExpanded"
        type="button"
        (click)="toggleGrammar()"
        class="w-full py-2 text-sm text-purple-600 hover:text-purple-800 hover:bg-purple-50 rounded-lg transition-colors"
      >
        Show {{ grammarPoints.length - 3 }} more points
      </button>
    </div>
  </div>

  <!-- Exercises Section (Count only) -->
  <div *ngIf="exerciseCount > 0" class="exercises-section">
    <div class="flex items-center gap-2 p-3 bg-green-50 rounded-lg">
      <fa-icon [icon]="faTasks" class="text-green-600"></fa-icon>
      <span class="font-medium text-gray-900">Exercises</span>
      <span class="text-sm text-gray-500">({{ exerciseCount }} exercises available)</span>
    </div>
  </div>

  <!-- Empty state -->
  <div
    *ngIf="vocabulary.length === 0 && grammarPoints.length === 0 && exerciseCount === 0"
    class="empty-state text-center py-6 text-gray-500"
  >
    <p>No learning content available</p>
  </div>
</div>
