<div
  *ngIf="isOpen"
  class="dialog-backdrop fixed inset-0 bg-black/50 flex items-center justify-center z-50"
  (click)="onBackdropClick($event)"
>
  <div class="dialog-content bg-white rounded-xl shadow-xl w-full max-w-md mx-4">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
      <div class="flex items-center gap-2">
        <fa-icon [icon]="faFolder" class="text-gray-700"></fa-icon>
        <h2 class="text-lg font-semibold text-gray-900">Save to Collection</h2>
      </div>
      <button
        type="button"
        (click)="onClose()"
        class="p-1 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-colors"
      >
        <fa-icon [icon]="faTimes"></fa-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="p-4">
      <!-- Loading state -->
      <div *ngIf="loading()" class="loading-state py-8 text-center">
        <fa-icon [icon]="faSpinner" animation="spin" class="text-2xl text-gray-400"></fa-icon>
        <p class="text-gray-500 mt-2">Loading collections...</p>
      </div>

      <!-- Collections list -->
      <div *ngIf="!loading()" class="collections-list">
        <!-- Empty state -->
        <div *ngIf="collections().length === 0 && !showCreateForm()" class="empty-state text-center py-6">
          <fa-icon [icon]="faFolderOpen" class="text-4xl text-gray-300"></fa-icon>
          <p class="text-gray-500 mt-2">No collections yet</p>
          <p class="text-sm text-gray-400">Create your first collection to organize posts</p>
        </div>

        <!-- List -->
        <div *ngIf="collections().length > 0" class="space-y-2 max-h-64 overflow-y-auto mb-4">
          <button
            *ngFor="let collection of collections()"
            type="button"
            (click)="toggleCollection(collection)"
            [disabled]="toggling() !== null"
            class="collection-item w-full flex items-center justify-between p-3 border rounded-lg transition-all hover:bg-gray-50"
            [class.border-gray-900]="collection.hasPost"
            [class.bg-gray-50]="collection.hasPost"
            [class.border-gray-200]="!collection.hasPost"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-5 h-5 rounded border-2 flex items-center justify-center"
                [class.border-gray-900]="collection.hasPost"
                [class.bg-gray-900]="collection.hasPost"
                [class.border-gray-300]="!collection.hasPost"
              >
                <fa-icon
                  *ngIf="collection.hasPost"
                  [icon]="faCheck"
                  class="text-xs text-white"
                ></fa-icon>
              </div>
              <div class="text-left">
                <div class="flex items-center gap-2">
                  <span class="font-medium text-gray-900">{{ collection.name }}</span>
                  <fa-icon
                    [icon]="collection.isPrivate ? faLock : faGlobe"
                    class="text-xs text-gray-400"
                    [title]="collection.isPrivate ? 'Private' : 'Public'"
                  ></fa-icon>
                </div>
                <span class="text-xs text-gray-500">{{ collection.postCount }} posts</span>
              </div>
            </div>
            <fa-icon
              *ngIf="toggling() === collection.id"
              [icon]="faSpinner"
              animation="spin"
              class="text-gray-400"
            ></fa-icon>
          </button>
        </div>

        <!-- Create new collection form -->
        <div *ngIf="showCreateForm()" class="create-form border-t border-gray-200 pt-4">
          <h3 class="font-medium text-gray-900 mb-3">Create New Collection</h3>

          <div class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
              <input
                type="text"
                [(ngModel)]="newCollectionName"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                placeholder="My Learning Collection"
                [disabled]="creating()"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
              <textarea
                [(ngModel)]="newCollectionDescription"
                rows="2"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent resize-none"
                placeholder="What's this collection about?"
                [disabled]="creating()"
              ></textarea>
            </div>

            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                [(ngModel)]="newCollectionPrivate"
                class="w-4 h-4 text-gray-900 border-gray-300 rounded focus:ring-gray-900"
                [disabled]="creating()"
              />
              <span class="text-sm text-gray-700">Make this collection private</span>
            </label>
          </div>

          <div class="flex justify-end gap-2 mt-4">
            <button
              type="button"
              (click)="toggleCreateForm()"
              class="px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
              [disabled]="creating()"
            >
              Cancel
            </button>
            <button
              type="button"
              (click)="createCollection()"
              [disabled]="!newCollectionName.trim() || creating()"
              class="flex items-center gap-2 px-3 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 disabled:opacity-50 transition-colors"
            >
              <fa-icon [icon]="creating() ? faSpinner : faPlus" [animation]="creating() ? 'spin' : undefined"></fa-icon>
              <span>{{ creating() ? 'Creating...' : 'Create' }}</span>
            </button>
          </div>
        </div>

        <!-- Create button -->
        <button
          *ngIf="!showCreateForm()"
          type="button"
          (click)="toggleCreateForm()"
          class="w-full flex items-center justify-center gap-2 p-3 border border-dashed border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 hover:border-gray-400 transition-colors"
        >
          <fa-icon [icon]="faPlus"></fa-icon>
          <span>Create New Collection</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end p-4 border-t border-gray-200">
      <button
        type="button"
        (click)="onClose()"
        class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors"
      >
        Done
      </button>
    </div>
  </div>
</div>
