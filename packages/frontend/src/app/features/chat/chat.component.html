<div class="h-full flex bg-gray-50">
  <!-- Sidebar -->
  <div
    class="w-80 bg-white border-r border-gray-200 flex flex-col"
    [class.hidden]="showChatWindow() && !isMobileMenuOpen()"
    [class.md:flex]="true"
  >
    <!-- Header -->
    <div class="p-4 border-b border-gray-200">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-semibold text-gray-900">Messages</h1>
        <div class="flex items-center gap-2">
          <!-- Blocked users button -->
          <button
            class="p-1.5 text-gray-500 hover:text-gray-700 rounded-lg hover:bg-gray-100"
            title="Blocked users"
            (click)="openBlockedUsers()"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
            </svg>
          </button>
          <!-- Connection status -->
          <span
            class="w-2 h-2 rounded-full"
            [class.bg-green-500]="isConnected()"
            [class.bg-gray-400]="!isConnected()"
            [title]="isConnected() ? 'Connected' : 'Disconnected'"
          ></span>
          <!-- Unread badge -->
          @if (totalUnread() > 0) {
            <span class="px-2 py-0.5 text-xs font-medium bg-gray-900 text-white rounded-full">
              {{ totalUnread() }}
            </span>
          }
        </div>
      </div>

      <!-- Status selector -->
      <app-status-selector
        [currentStatus]="currentStatus()"
        (statusChange)="chatService.updateStatus($event).subscribe()"
      />

      <!-- View tabs -->
      <div class="flex mt-4 bg-gray-100 rounded-lg p-1">
        <button
          class="flex-1 py-2 text-sm font-medium rounded-md transition-colors"
          [class.bg-white]="activeView() === 'conversations'"
          [class.text-gray-900]="activeView() === 'conversations'"
          [class.shadow-sm]="activeView() === 'conversations'"
          [class.text-gray-600]="activeView() !== 'conversations'"
          (click)="toggleView('conversations')"
        >
          Chats
        </button>
        <button
          class="flex-1 py-2 text-sm font-medium rounded-md transition-colors"
          [class.bg-white]="activeView() === 'users'"
          [class.text-gray-900]="activeView() === 'users'"
          [class.shadow-sm]="activeView() === 'users'"
          [class.text-gray-600]="activeView() !== 'users'"
          (click)="toggleView('users')"
        >
          Users
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto">
      @if (activeView() === 'conversations') {
        <app-conversation-list
          [conversations]="conversations()"
          [selectedId]="selectedConversationId()"
          [loading]="loading()"
          (conversationSelect)="selectConversation($event)"
        />
      } @else {
        <app-user-list
          (userSelect)="startConversationWithUser($event)"
        />
      }
    </div>
  </div>

  <!-- Chat Window -->
  <div class="flex-1 flex flex-col">
    @if (showChatWindow()) {
      <app-chat-window
        [conversation]="activeConversation()"
        [messages]="chatService.messages()"
        [typingUsers]="typingUsersForConversation()"
        (close)="closeConversation()"
        (sendMessage)="chatService.sendMessage($event).subscribe()"
        (loadMore)="chatService.getMessages(selectedConversationId()!, $event).subscribe()"
        (markRead)="chatService.markMessagesRead(selectedConversationId()!, $event).subscribe()"
        (startTyping)="socketService.startTyping(selectedConversationId()!)"
        (stopTyping)="socketService.stopTyping(selectedConversationId()!)"
        (settingsChange)="chatService.updateConversationSettings(selectedConversationId()!, $event).subscribe()"
        (blockUser)="onBlockUser($event)"
      />
    } @else {
      <!-- Empty state -->
      <div class="flex-1 flex items-center justify-center bg-gray-50">
        <div class="text-center">
          <div class="w-16 h-16 mx-auto mb-4 bg-gray-200 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
          </div>
          <h3 class="text-lg font-medium text-gray-900 mb-1">No conversation selected</h3>
          <p class="text-sm text-gray-500">Choose a conversation or start a new one</p>
        </div>
      </div>
    }
  </div>

  <!-- Mobile menu button -->
  <button
    class="md:hidden fixed bottom-4 left-4 w-12 h-12 bg-gray-900 text-white rounded-full shadow-lg flex items-center justify-center z-50"
    (click)="toggleMobileMenu()"
    [class.hidden]="!showChatWindow()"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Blocked Users Modal -->
  @if (showBlockedUsers()) {
    <app-blocked-users (close)="closeBlockedUsers()" />
  }
</div>
