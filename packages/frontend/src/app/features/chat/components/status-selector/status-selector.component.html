<div class="relative">
  <!-- Current status button -->
  <button
    class="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 transition-colors"
    (click)="toggleDropdown()"
  >
    <!-- Avatar -->
    <div class="relative flex-shrink-0">
      @if (currentStatus()?.avatar) {
        <img
          [src]="currentStatus()!.avatar"
          [alt]="currentStatus()!.username"
          class="w-10 h-10 rounded-full object-cover"
        />
      } @else {
        <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-sm font-medium text-gray-600">
          {{ getInitials() }}
        </div>
      }
      <span
        class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white"
        [class]="STATUS_COLORS[currentStatus()?.statusType || 'offline']"
      ></span>
    </div>

    <!-- Info -->
    <div class="flex-1 min-w-0 text-left">
      <div class="font-medium text-gray-900 truncate">
        {{ currentStatus()?.displayName || currentStatus()?.username || 'Loading...' }}
      </div>
      <div class="text-sm text-gray-500 truncate">
        @if (currentStatus()?.statusText) {
          {{ currentStatus()!.statusText }}
        } @else {
          {{ STATUS_LABELS[currentStatus()?.statusType || 'offline'] }}
        }
      </div>
    </div>

    <!-- Chevron -->
    <svg
      class="w-5 h-5 text-gray-400 transition-transform"
      [class.rotate-180]="isOpen()"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown -->
  @if (isOpen()) {
    <div
      class="absolute top-full left-0 right-0 mt-1 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50"
    >
      <!-- Status options -->
      @for (option of statusOptions; track option.type) {
        <button
          class="w-full flex items-center gap-3 px-4 py-2 hover:bg-gray-50 transition-colors text-left"
          [class.bg-gray-50]="currentStatus()?.statusType === option.type"
          (click)="selectStatus(option.type)"
        >
          <span
            class="w-3 h-3 rounded-full flex-shrink-0"
            [class]="option.color"
          ></span>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-900">{{ option.label }}</div>
            <div class="text-xs text-gray-500">{{ option.description }}</div>
          </div>
          @if (currentStatus()?.statusType === option.type) {
            <svg class="w-4 h-4 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          }
        </button>
      }

      <!-- Divider -->
      <div class="border-t border-gray-200 my-2"></div>

      <!-- Custom status -->
      @if (!showCustomInput()) {
        <button
          class="w-full flex items-center gap-3 px-4 py-2 hover:bg-gray-50 transition-colors text-left"
          (click)="toggleCustomInput()"
        >
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          <span class="text-sm text-gray-700">Set custom status</span>
        </button>
      } @else {
        <div class="px-4 py-2">
          <div class="flex gap-2">
            <input
              type="text"
              placeholder="What's on your mind?"
              class="flex-1 px-3 py-2 text-sm bg-gray-100 border-0 rounded-lg focus:ring-2 focus:ring-gray-300"
              [maxlength]="STATUS_TEXT_MAX_LENGTH"
              [ngModel]="customStatusText()"
              (ngModelChange)="customStatusText.set($event)"
              (keydown.enter)="saveCustomStatus()"
            />
            <button
              class="px-3 py-2 text-sm font-medium text-white bg-gray-900 rounded-lg hover:bg-gray-800"
              (click)="saveCustomStatus()"
            >
              Save
            </button>
          </div>
          @if (currentStatus()?.statusText) {
            <button
              class="mt-2 text-xs text-red-600 hover:text-red-700"
              (click)="clearCustomStatus()"
            >
              Clear custom status
            </button>
          }
        </div>
      }
    </div>

    <!-- Backdrop -->
    <div
      class="fixed inset-0 z-40"
      (click)="closeDropdown()"
    ></div>
  }
</div>
