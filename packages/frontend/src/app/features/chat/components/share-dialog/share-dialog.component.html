<!-- Backdrop -->
<div
  class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
  (click)="onBackdropClick($event)"
>
  <!-- Dialog -->
  <div class="bg-white rounded-xl shadow-xl max-w-md w-full max-h-[90vh] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
      <h2 class="text-lg font-semibold text-gray-900">Share</h2>
      <button
        class="p-2 -mr-2 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100"
        (click)="onClose()"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Content Preview -->
    <div class="p-4 border-b border-gray-200 bg-gray-50">
      <div class="flex items-center gap-3">
        <div
          class="w-12 h-12 rounded-lg flex items-center justify-center text-xl"
          [class]="content.iconBgColor"
        >
          <span>{{ content.icon }}</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-medium text-gray-900 truncate">{{ content.title }}</p>
          @if (content.subtitle) {
            <p class="text-sm text-gray-500 truncate">{{ content.subtitle }}</p>
          }
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="p-4 border-b border-gray-200">
      <div class="relative">
        <input
          type="text"
          placeholder="Search users..."
          class="w-full pl-10 pr-4 py-2 bg-gray-100 border-0 rounded-lg text-sm focus:ring-2 focus:ring-gray-300 focus:bg-white transition-colors"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
        />
        <svg
          class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
    </div>

    <!-- User List -->
    <div class="flex-1 overflow-y-auto max-h-60">
      @if (filteredUsers().length === 0) {
        <div class="p-8 text-center text-gray-500">
          <p>No users found</p>
        </div>
      } @else {
        <div class="divide-y divide-gray-100">
          @for (user of filteredUsers(); track user.userId) {
            <button
              class="w-full px-4 py-3 flex items-center gap-3 transition-colors text-left"
              [class.bg-gray-100]="selectedUserId() === user.userId"
              [class.hover:bg-gray-50]="selectedUserId() !== user.userId"
              (click)="selectUser(user.userId)"
            >
              <!-- Avatar -->
              <div class="relative flex-shrink-0">
                @if (user.avatar) {
                  <img
                    [src]="user.avatar"
                    [alt]="user.username"
                    class="w-10 h-10 rounded-full object-cover"
                  />
                } @else {
                  <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-sm font-medium text-gray-600">
                    {{ getInitials(user) }}
                  </div>
                }
                @if (user.isOnline) {
                  <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></span>
                }
              </div>

              <!-- Info -->
              <div class="flex-1 min-w-0">
                <span class="font-medium text-gray-900 truncate block">
                  {{ user.displayName || user.username }}
                </span>
                <span class="text-sm text-gray-500">
                  @if (user.isOnline) {
                    Online
                  } @else {
                    Offline
                  }
                </span>
              </div>

              <!-- Selected indicator -->
              @if (selectedUserId() === user.userId) {
                <div class="flex-shrink-0">
                  <svg class="w-5 h-5 text-gray-900" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                  </svg>
                </div>
              }
            </button>
          }
        </div>
      }
    </div>

    <!-- Comment -->
    <div class="p-4 border-t border-gray-200">
      <textarea
        placeholder="Add a comment (optional)..."
        class="w-full px-4 py-2 bg-gray-100 border-0 rounded-lg resize-none text-sm focus:ring-2 focus:ring-gray-300 focus:bg-white transition-colors"
        rows="2"
        [ngModel]="comment()"
        (ngModelChange)="comment.set($event)"
      ></textarea>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 p-4 border-t border-gray-200">
      <button
        class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
        (click)="onClose()"
      >
        Cancel
      </button>
      <button
        class="px-4 py-2 text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="!canShare()"
        (click)="onShare()"
      >
        @if (sending()) {
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Sending...
          </span>
        } @else {
          Share
        }
      </button>
    </div>
  </div>
</div>
