@if (isOpen()) {
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50 z-40" (click)="cancel()"></div>

  <!-- Dialog -->
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md" (click)="$event.stopPropagation()">
      <!-- Header -->
      <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-200">
        <fa-icon [icon]="faCog" class="text-gray-500"></fa-icon>
        <h2 class="text-xl font-semibold text-gray-800">Learning Goals</h2>
      </div>

      <!-- Content -->
      <div class="p-6 space-y-5">
        <!-- Daily New Words -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Daily New Words</label>
          <input type="number"
                 class="input w-full"
                 [(ngModel)]="dailyNewWords"
                 min="1"
                 max="50">
          <p class="text-xs text-gray-500 mt-1">New words to learn per day (1-50)</p>
        </div>

        <!-- Daily Reviews -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Daily Reviews</label>
          <input type="number"
                 class="input w-full"
                 [(ngModel)]="dailyReviews"
                 min="5"
                 max="200">
          <p class="text-xs text-gray-500 mt-1">Total reviews per day (5-200)</p>
        </div>

        <!-- Flashcard Direction -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Flashcard Direction</label>
          <select class="input w-full" [(ngModel)]="preferredDirection">
            <option value="vi_to_en">Vietnamese → English</option>
            <option value="en_to_vi">English → Vietnamese</option>
            <option value="mixed">Mixed (Random)</option>
          </select>
          <p class="text-xs text-gray-500 mt-1">Default direction for flashcards</p>
        </div>

        <!-- Reminder Toggle -->
        <div class="flex items-center gap-3">
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" [(ngModel)]="reminderEnabled">
            <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-gray-900 peer-focus:ring-4 peer-focus:ring-gray-300 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
          </label>
          <span class="text-sm font-medium text-gray-700">Enable Daily Reminder</span>
        </div>

        <!-- Reminder Time (conditional) -->
        @if (reminderEnabled) {
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Reminder Time</label>
            <input type="time"
                   class="input w-full"
                   [(ngModel)]="reminderTime">
            <p class="text-xs text-gray-500 mt-1">When to remind you to review</p>
          </div>
        }
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-xl">
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary flex items-center gap-2" (click)="save()" [disabled]="saving()">
          @if (saving()) {
            <fa-icon [icon]="faSpinner" animation="spin"></fa-icon>
          }
          Save
        </button>
      </div>
    </div>
  </div>
}
