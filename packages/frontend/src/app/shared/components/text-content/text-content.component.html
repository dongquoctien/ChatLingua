<div
  class="text-content rounded-lg border-l-4 p-4"
  [class]="typeClass"
  [class.ring-2]="config.highlight"
  [class.ring-gray-900]="config.highlight"
>
  <!-- Header -->
  @if (config.title || config.type) {
    <div class="flex items-center gap-2 mb-3">
      @if (config.type) {
        <i class="fa-solid {{ typeIcon }} {{ iconClass }}"></i>
      }
      @if (config.title) {
        <span class="font-medium text-gray-700">{{ config.title }}</span>
      }
    </div>
  }

  <!-- English Content -->
  <div class="text-gray-800 leading-relaxed whitespace-pre-wrap">{{ config.content }}</div>

  <!-- Vietnamese Translation -->
  @if (config.contentVi) {
    <div class="mt-3 pt-3 border-t border-gray-200">
      <p class="text-gray-500 text-sm italic leading-relaxed whitespace-pre-wrap">{{ config.contentVi }}</p>
    </div>
  }
</div>
