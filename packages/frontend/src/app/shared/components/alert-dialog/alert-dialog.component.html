<!-- Backdrop -->
<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" (click)="close()">
  <!-- Dialog -->
  <div class="bg-white rounded-xl shadow-xl max-w-md w-full overflow-hidden" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
          <fa-icon [icon]="faInfoCircle" class="text-gray-700 text-lg"></fa-icon>
        </div>
        <h2 class="text-lg font-semibold text-gray-900">{{ data.title }}</h2>
      </div>
      <button (click)="close()"
              class="p-2 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
        <fa-icon [icon]="faTimes"></fa-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-5">
      <p class="text-gray-600 leading-relaxed">{{ data.message }}</p>
    </div>

    <!-- Footer -->
    <div class="flex justify-end px-6 py-4 bg-gray-50 border-t border-gray-200">
      <button (click)="close()"
              class="px-4 py-2.5 rounded-lg font-medium text-white bg-gray-900 hover:bg-gray-800 transition-colors">
        {{ data.buttonText || 'OK' }}
      </button>
    </div>
  </div>
</div>
