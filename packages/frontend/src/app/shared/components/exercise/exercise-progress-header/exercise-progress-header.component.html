<div class="flex flex-col gap-4 mb-4">
  <!-- Progress bar and timer -->
  <div class="flex flex-col md:flex-row md:items-center gap-3 md:gap-6 p-4 bg-white rounded-lg shadow-sm">
    <div class="flex-1">
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div class="bg-gray-900 h-2 rounded-full transition-all duration-300" [style.width.%]="progressPercent()"></div>
      </div>
      <div class="flex justify-between mt-2 text-sm">
        <span class="text-gray-600">Question {{ currentIndex() + 1 }} of {{ totalQuestions() }}</span>
        <span class="text-gray-900 font-medium">{{ answeredCount() }}/{{ totalQuestions() }} answered</span>
      </div>
    </div>
    <div class="flex items-center gap-2 px-4 py-2 rounded-full font-semibold self-end md:self-auto transition-colors"
         [ngClass]="{
           'bg-red-100 text-red-700 timer-warning': isWarning(),
           'bg-gray-100 text-gray-700': !isWarning()
         }">
      <fa-icon [icon]="faClock"></fa-icon>
      <span>{{ formattedTime() }}</span>
    </div>
  </div>

  <!-- Keyboard shortcuts hint (desktop) -->
  @if (showKeyboardHints()) {
    <div class="hidden md:flex justify-center gap-5 px-4 py-2 bg-gray-100 rounded-lg text-sm text-gray-600">
      <span class="flex items-center gap-1">
        <kbd class="px-2 py-0.5 bg-white border border-gray-300 rounded text-xs font-medium">←</kbd>
        <kbd class="px-2 py-0.5 bg-white border border-gray-300 rounded text-xs font-medium">→</kbd>
        Navigate
      </span>
      <span class="flex items-center gap-1">
        <kbd class="px-2 py-0.5 bg-white border border-gray-300 rounded text-xs font-medium">1-4</kbd>
        Select option
      </span>
      <span class="flex items-center gap-1">
        <kbd class="px-2 py-0.5 bg-white border border-gray-300 rounded text-xs font-medium">Ctrl+Enter</kbd>
        Submit
      </span>
    </div>
  }

  <!-- Mobile swipe hint -->
  @if (showMobileHint()) {
    <div class="md:hidden text-center p-3 bg-gray-100 rounded-lg">
      <span class="text-sm text-gray-700">👆 Swipe left/right to navigate 👆</span>
    </div>
  }
</div>
