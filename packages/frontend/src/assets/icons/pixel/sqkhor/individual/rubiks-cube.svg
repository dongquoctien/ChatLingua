<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" class="pixelicon-rubiks-cube">
	<!-- Top face - yellow/orange/green -->
	<rect fill="#FFE800" x="1" y="1" width="2" height="2"/>
	<rect fill="#FF6B00" x="3" y="1" width="2" height="2"/>
	<rect fill="#00B336" x="5" y="1" width="2" height="2"/>
	<!-- Middle face - blue/white/red -->
	<rect fill="#0066FF" x="1" y="3" width="2" height="2"/>
	<rect fill="#EBEAF7" x="3" y="3" width="2" height="2"/>
	<rect fill="#F92F3C" x="5" y="3" width="2" height="2"/>
	<!-- Bottom face - green/red/yellow -->
	<rect fill="#00B336" x="1" y="5" width="2" height="2"/>
	<rect fill="#F92F3C" x="3" y="5" width="2" height="2"/>
	<rect fill="#FFE800" x="5" y="5" width="2" height="2"/>
	<!-- Grid lines - dark -->
	<rect fill="#343341" x="0" y="3" width="8" height="1"/>
	<rect fill="#343341" x="0" y="5" width="8" height="1"/>
	<rect fill="#343341" x="3" y="0" width="1" height="8"/>
	<rect fill="#343341" x="5" y="0" width="1" height="8"/>
</svg>
