<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" class="pixelicon-pill">
	<!-- Pill capsule left half - red -->
	<polygon fill="#F92F3C" points="1,3 1,6 2,6 2,7 3,7 3,8 4,8 4,1 3,1 3,2 2,2 2,3"/>
	<!-- Red highlight -->
	<rect fill="#FF6B7A" x="2" y="3" width="1" height="2"/>
	<!-- Pill capsule right half - white -->
	<polygon fill="#EBEAF7" points="4,1 4,8 5,8 5,7 6,7 6,6 7,6 7,3 6,3 6,2 5,2 5,1"/>
	<!-- White shadow -->
	<rect fill="#C5C4D4" x="6" y="3" width="1" height="3"/>
	<!-- Sparkle effect - super vitamin -->
	<rect fill="#FFE800" x="0" y="1" width="1" height="1"/>
	<rect fill="#FFE800" x="7" y="2" width="1" height="1"/>
	<rect fill="#FFE800" x="1" y="7" width="1" height="1"/>
	<rect fill="#FFE800" x="7" y="6" width="1" height="1"/>
</svg>
