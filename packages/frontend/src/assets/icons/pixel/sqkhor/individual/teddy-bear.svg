<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" class="pixelicon-teddy-bear">
	<!-- Ears -->
	<rect fill="#B67100" x="1" y="0" width="2" height="2"/>
	<rect fill="#B67100" x="6" y="0" width="2" height="2"/>
	<!-- Inner ears -->
	<rect fill="#FFB100" x="1" y="1" width="1" height="1"/>
	<rect fill="#FFB100" x="7" y="1" width="1" height="1"/>
	<!-- Head -->
	<polygon fill="#B67100" points="2,1 2,5 3,5 3,6 6,6 6,5 7,5 7,1"/>
	<!-- Face/muzzle -->
	<polygon fill="#FFB100" points="3,3 3,5 6,5 6,3 5,3 5,2 4,2 4,3"/>
	<!-- Eyes -->
	<rect fill="#343341" x="2" y="2" width="1" height="1"/>
	<rect fill="#343341" x="6" y="2" width="1" height="1"/>
	<!-- Nose -->
	<rect fill="#343341" x="4" y="3" width="1" height="1"/>
	<!-- Body -->
	<polygon fill="#B67100" points="2,6 2,8 3,8 3,9 6,9 6,8 7,8 7,6"/>
	<!-- Belly -->
	<rect fill="#FFB100" x="3" y="7" width="3" height="1"/>
	<!-- Arms -->
	<rect fill="#B67100" x="1" y="6" width="1" height="2"/>
	<rect fill="#B67100" x="7" y="6" width="1" height="2"/>
</svg>
