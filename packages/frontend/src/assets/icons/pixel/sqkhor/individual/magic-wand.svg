<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" class="pixelicon-magic-wand">
	<!-- Wand stick -->
	<rect fill="#343341" x="5" y="4" width="1" height="1"/>
	<rect fill="#343341" x="6" y="5" width="1" height="1"/>
	<rect fill="#343341" x="7" y="6" width="1" height="2"/>
	<!-- Wand tip - gold -->
	<rect fill="#FFE800" x="4" y="3" width="1" height="1"/>
	<rect fill="#FFC800" x="3" y="2" width="1" height="1"/>
	<!-- Sparkles -->
	<rect fill="#FFE800" x="1" y="0" width="1" height="1"/>
	<rect fill="#FFE800" x="0" y="1" width="1" height="1"/>
	<rect fill="#FFE800" x="2" y="1" width="1" height="1"/>
	<rect fill="#FFE800" x="1" y="2" width="1" height="1"/>
	<!-- More sparkles -->
	<rect fill="#FFE800" x="5" y="1" width="1" height="1"/>
	<rect fill="#FFE800" x="2" y="4" width="1" height="1"/>
	<rect fill="#EBEAF7" x="0" y="3" width="1" height="1"/>
	<rect fill="#EBEAF7" x="4" y="0" width="1" height="1"/>
</svg>
