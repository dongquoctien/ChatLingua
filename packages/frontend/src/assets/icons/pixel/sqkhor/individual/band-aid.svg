<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" class="pixelicon-band-aid">
	<!-- Band-aid body - beige/tan color -->
	<polygon fill="#E8C9A0" points="1,3 3,1 6,1 8,3 8,6 6,8 3,8 1,6"/>
	<!-- Darker edges -->
	<rect fill="#D4A574" x="1" y="3" width="1" height="3"/>
	<rect fill="#D4A574" x="7" y="3" width="1" height="3"/>
	<rect fill="#D4A574" x="3" y="1" width="3" height="1"/>
	<rect fill="#D4A574" x="3" y="7" width="3" height="1"/>
	<!-- Center pad - white -->
	<rect fill="#EBEAF7" x="3" y="3" width="3" height="3"/>
	<!-- Holes/texture on sides -->
	<rect fill="#C49A6C" x="2" y="3" width="1" height="1"/>
	<rect fill="#C49A6C" x="2" y="5" width="1" height="1"/>
	<rect fill="#C49A6C" x="6" y="3" width="1" height="1"/>
	<rect fill="#C49A6C" x="6" y="5" width="1" height="1"/>
	<!-- Red cross on pad -->
	<rect fill="#F92F3C" x="4" y="3" width="1" height="3"/>
	<rect fill="#F92F3C" x="3" y="4" width="3" height="1"/>
</svg>
