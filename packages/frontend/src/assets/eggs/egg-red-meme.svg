<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <defs>
    <linearGradient id="egg-red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fecaca"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="egg-red-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="egg-red-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="egg-red-meme" patternUnits="userSpaceOnUse" width="16" height="16">
      <text x="8" y="12" font-size="8" text-anchor="middle" fill="#fca5a5" opacity="0.4">?</text>
    </pattern>
  </defs>
  <!-- Outer glow -->
  <ellipse cx="32" cy="42" rx="30" ry="36" fill="#ef4444" opacity="0.25" filter="url(#egg-red-glow)"/>
  <!-- Egg shadow -->
  <ellipse cx="32" cy="75" rx="20" ry="4" fill="rgba(239,68,68,0.3)"/>
  <!-- Egg body -->
  <ellipse cx="32" cy="42" rx="26" ry="32" fill="url(#egg-red-gradient)" stroke="#b91c1c" stroke-width="2"/>
  <!-- Meme pattern overlay -->
  <ellipse cx="32" cy="42" rx="24" ry="30" fill="url(#egg-red-meme)" opacity="0.3"/>
  <!-- Egg shine -->
  <ellipse cx="22" cy="30" rx="8" ry="12" fill="url(#egg-red-shine)"/>
  <!-- Meme face hint - troll face eyes -->
  <ellipse cx="26" cy="38" rx="4" ry="3" fill="none" stroke="#fecaca" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="38" cy="38" rx="4" ry="3" fill="none" stroke="#fecaca" stroke-width="1.5" opacity="0.7"/>
  <circle cx="27" cy="38" r="1.5" fill="#fecaca" opacity="0.8"/>
  <circle cx="39" cy="38" r="1.5" fill="#fecaca" opacity="0.8"/>
  <!-- Meme smile -->
  <path d="M24 48 Q32 56 40 48" fill="none" stroke="#fecaca" stroke-width="1.5" opacity="0.6"/>
  <!-- Floating sparkles -->
  <circle cx="44" cy="28" r="1.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="18" cy="45" r="0.8" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="46" cy="52" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
