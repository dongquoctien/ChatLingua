<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <defs>
    <linearGradient id="egg-orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fed7aa"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </linearGradient>
    <linearGradient id="egg-orange-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="egg-orange-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="egg-orange-meme" patternUnits="userSpaceOnUse" width="18" height="18">
      <text x="9" y="13" font-size="7" text-anchor="middle" fill="#fdba74" opacity="0.35">!</text>
    </pattern>
  </defs>
  <!-- Outer glow -->
  <ellipse cx="32" cy="42" rx="30" ry="36" fill="#f97316" opacity="0.25" filter="url(#egg-orange-glow)"/>
  <!-- Egg shadow -->
  <ellipse cx="32" cy="75" rx="20" ry="4" fill="rgba(249,115,22,0.3)"/>
  <!-- Egg body -->
  <ellipse cx="32" cy="42" rx="26" ry="32" fill="url(#egg-orange-gradient)" stroke="#c2410c" stroke-width="2"/>
  <!-- Meme pattern overlay -->
  <ellipse cx="32" cy="42" rx="24" ry="30" fill="url(#egg-orange-meme)" opacity="0.3"/>
  <!-- Egg shine -->
  <ellipse cx="22" cy="30" rx="8" ry="12" fill="url(#egg-orange-shine)"/>
  <!-- Stonks arrow hint -->
  <path d="M22 52 L28 44 L34 48 L42 36" fill="none" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <polygon points="42,36 38,38 40,42" fill="#fed7aa" opacity="0.6"/>
  <!-- Surprised eyes -->
  <circle cx="26" cy="38" r="3" fill="none" stroke="#fed7aa" stroke-width="1.5" opacity="0.5"/>
  <circle cx="38" cy="38" r="3" fill="none" stroke="#fed7aa" stroke-width="1.5" opacity="0.5"/>
  <!-- Floating sparkles -->
  <circle cx="46" cy="30" r="1.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="42" r="0.8" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="55" r="1" fill="#ffffff">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
