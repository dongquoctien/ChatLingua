<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <defs>
    <linearGradient id="egg-rare-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bfdbfe"/>
      <stop offset="50%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="egg-rare-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="egg-rare-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glow effect -->
  <ellipse cx="32" cy="42" rx="28" ry="34" fill="#60a5fa" opacity="0.3" filter="url(#egg-rare-glow)"/>
  <!-- Egg shadow -->
  <ellipse cx="32" cy="75" rx="20" ry="4" fill="rgba(59,130,246,0.25)"/>
  <!-- Egg body -->
  <ellipse cx="32" cy="42" rx="26" ry="32" fill="url(#egg-rare-gradient)" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Egg shine -->
  <ellipse cx="22" cy="30" rx="8" ry="12" fill="url(#egg-rare-shine)"/>
  <!-- Sparkle pattern -->
  <polygon points="40,28 41,32 45,32 42,35 43,39 40,36 37,39 38,35 35,32 39,32" fill="#ffffff" opacity="0.9"/>
  <polygon points="24,48 25,50 27,50 25.5,51.5 26,54 24,52 22,54 22.5,51.5 21,50 23,50" fill="#ffffff" opacity="0.7"/>
  <circle cx="36" cy="55" r="1.5" fill="#ffffff" opacity="0.6"/>
</svg>
