<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="holoGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="20%" style="stop-color:#FFE66D"/>
      <stop offset="40%" style="stop-color:#4ECDC4"/>
      <stop offset="60%" style="stop-color:#45B7D1"/>
      <stop offset="80%" style="stop-color:#DDA0DD"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
    <linearGradient id="holoGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DDA0DD"/>
      <stop offset="25%" style="stop-color:#45B7D1"/>
      <stop offset="50%" style="stop-color:#4ECDC4"/>
      <stop offset="75%" style="stop-color:#FFE66D"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
    <filter id="holoGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#DDA0DD" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="holoPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="url(#holoGradient1)" opacity="0.3"/>
      <line x1="0" y1="0" x2="10" y2="10" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Holographic background shimmer -->
  <rect x="2" y="2" width="116" height="116" rx="14" fill="url(#holoPattern)" opacity="0.5"/>
  <!-- Main frame with rainbow gradient -->
  <rect x="4" y="4" width="112" height="112" rx="12" ry="12" fill="none" stroke="url(#holoGradient1)" stroke-width="5" filter="url(#holoGlow)"/>
  <!-- Inner frame with opposite gradient -->
  <rect x="10" y="10" width="100" height="100" rx="8" ry="8" fill="none" stroke="url(#holoGradient2)" stroke-width="2"/>
  <!-- Holographic sparkles -->
  <circle cx="20" cy="20" r="3" fill="#FFE66D" opacity="0.8"/>
  <circle cx="100" cy="20" r="3" fill="#4ECDC4" opacity="0.8"/>
  <circle cx="20" cy="100" r="3" fill="#45B7D1" opacity="0.8"/>
  <circle cx="100" cy="100" r="3" fill="#DDA0DD" opacity="0.8"/>
  <circle cx="60" cy="10" r="2" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="60" cy="110" r="2" fill="#4ECDC4" opacity="0.8"/>
  <circle cx="10" cy="60" r="2" fill="#FFE66D" opacity="0.8"/>
  <circle cx="110" cy="60" r="2" fill="#DDA0DD" opacity="0.8"/>
  <!-- Center preview area -->
  <rect x="24" y="24" width="72" height="72" rx="6" fill="#FFFFFF" opacity="0.1"/>
</svg>
