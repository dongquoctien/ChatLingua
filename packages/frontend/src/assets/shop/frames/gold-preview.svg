<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066"/>
      <stop offset="25%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#DAA520"/>
      <stop offset="75%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer gold frame -->
  <rect x="4" y="4" width="112" height="112" rx="12" ry="12" fill="none" stroke="url(#goldGradient)" stroke-width="7" filter="url(#goldGlow)"/>
  <!-- Inner highlight -->
  <rect x="11" y="11" width="98" height="98" rx="8" ry="8" fill="none" stroke="#FFE066" stroke-width="2" opacity="0.7"/>
  <!-- Corner gems -->
  <polygon points="16,8 20,16 12,16" fill="#FFD700"/>
  <polygon points="104,8 108,16 100,16" fill="#FFD700"/>
  <polygon points="16,112 20,104 12,104" fill="#FFD700"/>
  <polygon points="104,112 108,104 100,104" fill="#FFD700"/>
  <!-- Side decorations -->
  <circle cx="60" cy="8" r="5" fill="#FFE066"/>
  <circle cx="60" cy="112" r="5" fill="#FFE066"/>
  <circle cx="8" cy="60" r="5" fill="#FFE066"/>
  <circle cx="112" cy="60" r="5" fill="#FFE066"/>
  <!-- Center preview area -->
  <rect x="24" y="24" width="72" height="72" rx="6" fill="#FFFACD" opacity="0.2"/>
</svg>
