<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="galaxyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4B0082"/>
      <stop offset="50%" style="stop-color:#1a0533"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </radialGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.8"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="nebulaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00FFFF;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#9400D3;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <!-- Galaxy background -->
  <circle cx="60" cy="60" r="55" fill="url(#galaxyBg)"/>
  <!-- Nebula clouds -->
  <ellipse cx="40" cy="45" rx="30" ry="20" fill="url(#nebulaGradient)" transform="rotate(-30, 40, 45)"/>
  <ellipse cx="80" cy="75" rx="25" ry="15" fill="url(#nebulaGradient)" transform="rotate(20, 80, 75)"/>
  <!-- Spiral arms -->
  <path d="M60,60 Q70,30 100,40 Q90,60 95,90 Q60,85 40,95 Q30,70 20,60 Q30,30 60,20 Q75,35 60,60"
        fill="none" stroke="#9400D3" stroke-width="3" opacity="0.4"/>
  <!-- Bright stars -->
  <circle cx="60" cy="60" r="6" fill="#FFFFFF" filter="url(#starGlow)"/>
  <circle cx="30" cy="35" r="3" fill="#FFFFFF" filter="url(#starGlow)"/>
  <circle cx="90" cy="40" r="4" fill="#87CEEB" filter="url(#starGlow)"/>
  <circle cx="25" cy="70" r="3" fill="#FFD700" filter="url(#starGlow)"/>
  <circle cx="95" cy="80" r="3" fill="#FFFFFF" filter="url(#starGlow)"/>
  <circle cx="45" cy="90" r="2" fill="#FF69B4" filter="url(#starGlow)"/>
  <circle cx="75" cy="25" r="2" fill="#00FFFF" filter="url(#starGlow)"/>
  <!-- Small twinkling stars -->
  <circle cx="20" cy="25" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="50" cy="18" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="100" cy="55" r="1.5" fill="#FFD700" opacity="0.6"/>
  <circle cx="15" cy="90" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="105" cy="25" r="1" fill="#87CEEB" opacity="0.8"/>
  <circle cx="70" cy="100" r="1.5" fill="#FFFFFF" opacity="0.6"/>
</svg>
