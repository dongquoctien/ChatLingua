<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="heartGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FF69B4" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF69B4"/>
      <stop offset="100%" style="stop-color:#FF1493"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="50" fill="#FFE4EC" opacity="0.3"/>
  <!-- Main heart -->
  <path d="M60,95 C40,75 20,60 20,40 C20,25 35,15 50,25 C55,28 60,35 60,35 C60,35 65,28 70,25 C85,15 100,25 100,40 C100,60 80,75 60,95Z"
        fill="url(#heartGradient)" filter="url(#heartGlow)"/>
  <!-- Small floating hearts -->
  <path d="M25,20 C22,15 15,18 15,25 C15,32 25,38 25,38 C25,38 35,32 35,25 C35,18 28,15 25,20Z"
        fill="#FF69B4" opacity="0.8" filter="url(#heartGlow)"/>
  <path d="M95,25 C93,21 88,23 88,28 C88,33 95,37 95,37 C95,37 102,33 102,28 C102,23 97,21 95,25Z"
        fill="#FF1493" opacity="0.7" filter="url(#heartGlow)"/>
  <path d="M20,70 C18,67 14,68 14,72 C14,76 20,79 20,79 C20,79 26,76 26,72 C26,68 22,67 20,70Z"
        fill="#FF69B4" opacity="0.6" filter="url(#heartGlow)"/>
  <path d="M100,65 C98,62 94,63 94,67 C94,71 100,74 100,74 C100,74 106,71 106,67 C106,63 102,62 100,65Z"
        fill="#FF1493" opacity="0.6" filter="url(#heartGlow)"/>
  <!-- Tiny hearts -->
  <circle cx="40" cy="15" r="4" fill="#FFB6C1"/>
  <circle cx="80" cy="12" r="3" fill="#FF69B4"/>
  <circle cx="15" cy="50" r="3" fill="#FFB6C1"/>
  <circle cx="105" cy="50" r="3" fill="#FF69B4"/>
</svg>
