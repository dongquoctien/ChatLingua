services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: chatlingua-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: host.docker.internal
      DB_USER: ${MYSQL_USER:-chatlingua}
      DB_PASSWORD: ${MYSQL_PASSWORD:-chatlingua_pass}
      DB_NAME: ${MYSQL_DATABASE:-chatlingua}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatlingua-network

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: chatlingua-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - chatlingua-network

networks:
  chatlingua-network:
    driver: bridge
