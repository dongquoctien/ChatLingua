# ============================================================
# ChatLingua CI Pipeline
# Runs on Pull Requests - Build & Test only (no deploy)
# ============================================================

name: CI - Build & Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ========================================
  # Build and Test
  # ========================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@chatlingua/shared

      - name: Build backend
        run: npm run build --workspace=@chatlingua/backend

      - name: Build frontend
        run: npm run build --workspace=@chatlingua/frontend -- --configuration=production

      # Uncomment when tests are ready
      # - name: Run backend tests
      #   run: npm test --workspace=@chatlingua/backend

      # - name: Run frontend tests
      #   run: npm test --workspace=@chatlingua/frontend -- --no-watch --browsers=ChromeHeadless

  # ========================================
  # Docker Build Test
  # ========================================
  docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: chatlingua/backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: chatlingua/frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
