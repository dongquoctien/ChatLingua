# ============================================================
# ChatLingua Production - Using GitHub Container Registry
# Use this when deploying via GitHub Actions CI/CD
# ============================================================

services:
  # ========================================
  # MySQL Database
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: chatlingua-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: chatlingua
      MYSQL_USER: chatlingua
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - chatlingua-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ========================================
  # Backend API - From GHCR
  # ========================================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: chatlingua-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: chatlingua
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: chatlingua
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: https://chatlingua.online
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chatlingua-network
    expose:
      - "3000"

  # ========================================
  # Frontend - From GHCR
  # ========================================
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    container_name: chatlingua-frontend
    restart: always
    networks:
      - chatlingua-network
    expose:
      - "4000"

  # ========================================
  # Nginx Reverse Proxy
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: chatlingua-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - chatlingua-network
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  # ========================================
  # Certbot for SSL
  # ========================================
  certbot:
    image: certbot/certbot
    container_name: chatlingua-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  chatlingua-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
